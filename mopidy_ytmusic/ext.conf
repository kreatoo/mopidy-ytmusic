[ytmusic]
enabled = true
auth_json =
# Only needed for OAuth auth (see `mopidy ytmusic oauth`):
oauth_client_id =
oauth_client_secret =
auto_playlist_refresh = 60
# Legacy option kept for compatibility with old configs. Stream URLs are
# resolved with yt-dlp which manages its own player, so this is now unused.
youtube_player_refresh = 15
playlist_item_limit = 100
subscribed_artist_limit = 100
enable_history = yes
enable_liked_songs = yes
enable_mood_genre = yes
enable_scrobbling = yes
# Radio: endless recommended tracks. enable_radio adds a "Radio" entry to
# the root browse; auto_radio continues automatically when the queue ends.
enable_radio = yes
auto_radio = yes
# OpenSubsonic server (Nocturne, DSub, Sublime Music, ...) - see README.
enable_subsonic = no
subsonic_host = 127.0.0.1
subsonic_port = 4533
subsonic_username = mopidy
subsonic_password = mopidy
stream_preference = 141, 251, 140, 250, 249
verify_track_url = yes
