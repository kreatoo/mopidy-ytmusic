name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install system dependencies (for Mopidy 4 / GStreamer)
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libgirepository1.0-dev gstreamer1.0-plugins-base
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install . pytest
      - name: Show versions
        run: |
          python -c "import mopidy; print('mopidy', mopidy.__version__)"
          python -c "from importlib.metadata import version; print('ytmusicapi', version('ytmusicapi'))"
      - name: Run tests
        run: pytest -v
